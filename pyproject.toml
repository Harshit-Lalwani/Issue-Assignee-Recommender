[project]
name = "issue-assignee-recommender"
version = "0.1.0"
description = "Two-stage recommender that ranks the developers most likely to resolve a newly-filed Jira issue."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=16.0",
    "orjson>=3.10",
    "tqdm>=4.66",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "requests>=2.31",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
